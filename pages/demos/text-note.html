<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pretext Demo — 动感文本笔记</title>
<style>
  :root {
    --bg: #0d0d12;
    --card: #16161f;
    --card-border: #2a2a3a;
    --accent: #7c6aff;
    --accent-dim: #7c6aff33;
    --text: #e8e8f0;
    --text-dim: #6a6a80;
    --input-bg: #1a1a26;
    --font: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
    --font-note: 'Georgia', 'Noto Serif SC', serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--card-border) 1px, transparent 1px),
      linear-gradient(90deg, var(--card-border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.15;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    padding: 28px 36px 20px;
    border-bottom: 1px solid var(--card-border);
    display: flex;
    align-items: baseline;
    gap: 16px;
  }

  header h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }

  header span {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  #notes-container {
    position: relative;
    z-index: 1;
    flex: 1;
    overflow-y: auto;
    padding: 32px 36px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .note-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 14px;
    transition: border-color 0.3s;
    opacity: 0;
    transform: translateY(20px);
  }

  .note-card.landed {
    animation: land 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  .note-card:hover {
    border-color: var(--accent-dim);
  }

  .note-meta {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  .note-text {
    font-family: var(--font-note);
    font-size: 17px;
    line-height: 1.75;
    color: var(--text);
    letter-spacing: 0.02em;
    white-space: pre-wrap;
  }

  .note-count {
    position: absolute;
    top: 20px;
    right: 24px;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
  }

  /* flying text element */
  .flying-text {
    position: fixed;
    font-family: var(--font-note);
    font-size: 17px;
    line-height: 1.75;
    color: var(--text);
    letter-spacing: 0.02em;
    white-space: pre-wrap;
    pointer-events: none;
    z-index: 100;
    will-change: transform, opacity;
    text-shadow: 0 0 30px var(--accent);
  }

  /* input area */
  #input-area {
    position: relative;
    z-index: 10;
    padding: 20px 36px 28px;
    border-top: 1px solid var(--card-border);
    background: linear-gradient(to top, var(--bg) 60%, transparent);
  }

  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    background: var(--input-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
    overflow: hidden;
  }

  .input-wrapper:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim), 0 0 30px var(--accent-dim);
  }

  .input-prefix {
    padding-left: 18px;
    color: var(--accent);
    font-size: 16px;
    user-select: none;
    flex-shrink: 0;
  }

  #text-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--font-note);
    font-size: 17px;
    line-height: 1.75;
    padding: 16px 12px;
    letter-spacing: 0.02em;
    resize: none;
    min-height: 58px;
    max-height: 200px;
    overflow-y: auto;
  }

  #text-input::placeholder {
    color: var(--text-dim);
    font-style: italic;
  }

  .submit-btn {
    flex-shrink: 0;
    margin: 8px 10px 8px 0;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 8px 16px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
    font-family: var(--font);
  }

  .submit-btn:hover {
    opacity: 0.85;
    transform: scale(1.03);
  }

  .submit-btn:active {
    transform: scale(0.97);
  }

  .submit-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    transform: none;
  }

  .hint {
    margin-top: 10px;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-align: center;
  }

  /* empty state */
  #empty-state {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    user-select: none;
  }

  #empty-state .big {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.15;
  }

  #empty-state p {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
  }

  @keyframes land {
    from {
      opacity: 0;
      transform: translateY(20px) scale(0.96);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 var(--accent-dim); }
    70% { box-shadow: 0 0 0 12px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  .note-card.just-landed {
    animation: land 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
               pulse-ring 0.6s ease-out 0.1s;
  }
</style>
</head>
<body>

<header>
  <h1>动感文本笔记</h1>
  <span>Pretext · Dynamic Text Note</span>
</header>

<div id="notes-container">
  <div id="empty-state">
    <div class="big">✎</div>
    <p>在此输入你的笔记，按 Enter 发送</p>
  </div>
</div>

<div id="input-area">
  <div class="input-wrapper">
    <span class="input-prefix">›</span>
    <textarea
      id="text-input"
      placeholder="写下你的想法..."
      rows="1"
      spellcheck="false"
    ></textarea>
    <button class="submit-btn" id="submit-btn" disabled>发送</button>
  </div>
  <div class="hint">输入内容后按 <strong>Enter</strong> 或点击发送 · <strong>Shift+Enter</strong> 换行</div>
</div>

<script type="module" src="./text-note.ts"></script>
</body>
</html>
